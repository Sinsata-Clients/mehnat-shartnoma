<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shartnoma — Mehnat Shartnomasi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-logo">🎓</span>
      <h2>Mehnat Shartnomalari</h2>
    </div>
    <div class="topbar-right">
      <button class="btn-logout" id="logoutBtn">Chiqish</button>
    </div>
  </div>

  <div class="main-content">
    <div class="breadcrumb">
      <span onclick="window.location.href='dashboard.html'">Dashboard</span>
      <span> › </span>
      <span id="breadcrumbTitle">Yangi shartnoma</span>
    </div>

    <div class="form-card">
      <h3 id="formTitle">Yangi shartnoma qo'shish</h3>
      <p class="form-subtitle">Barcha majburiy maydonlarni to'ldiring</p>

      <div class="form-section-title">👤 Shaxsiy ma'lumotlar</div>
      <div class="form-row">
        <div class="form-group">
          <label>F.I.O <span class="required">*</span></label>
          <input type="text" id="fullName" placeholder="Karimov Jasur Aliyevich">
        </div>
        <div class="form-group">
          <label>Lavozim <span class="required">*</span></label>
          <input type="text" id="position" placeholder="Dotsent">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Bo'lim <span class="required">*</span></label>
          <input type="text" id="department" placeholder="Axborot texnologiyalari">
        </div>
        <div class="form-group">
          <label>Shartnoma raqami <span class="required">*</span></label>
          <input type="text" id="contractNumber" placeholder="2024-001">
        </div>
      </div>

      <div class="form-section-title">📅 Shartnoma muddati</div>
      <div class="form-row">
        <div class="form-group">
          <label>Boshlanish sanasi <span class="required">*</span></label>
          <input type="date" id="startDate">
        </div>
        <div class="form-group">
          <label>Tugash sanasi <span class="required">*</span></label>
          <input type="date" id="endDate">
        </div>
      </div>

      <div class="form-section-title">💰 Moliyaviy ma'lumotlar</div>
      <div class="form-row">
        <div class="form-group">
          <label>Oylik maosh (so'm) <span class="required">*</span></label>
          <input type="number" id="salary" placeholder="5000000">
        </div>
        <div class="form-group">
          <label>Ish turi</label>
          <select id="workType">
            <option value="Asosiy ish joyi">Asosiy ish joyi</option>
            <option value="Yarim stavka">Yarim stavka</option>
            <option value="Soatbay">Soatbay</option>
          </select>
        </div>
      </div>

      <div class="form-section-title">🪪 Xodim rekvizitlari</div>

      <div class="form-row">
        <div class="form-group">
          <label>Pasport seriyasi <span class="required">*</span></label>
          <div class="passport-wrap">
            <input type="text" id="passportSeries" maxlength="2" placeholder="AB" class="passport-series">
            <input type="text" id="passportNumber" maxlength="7" placeholder="1234567" class="passport-number">
          </div>
        </div>
        <div class="form-group">
          <label>JSHSHIR <span class="required">*</span></label>
          <input type="text" id="jshshir" maxlength="14" placeholder="12345678901234">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Yashash manzili <span class="required">*</span></label>
          <input type="text" id="xodimAddress" placeholder="Toshkent sh., Chilonzor tumani">
        </div>
        <div class="form-group">
          <label>Telefon raqami <span class="required">*</span></label>
          <input type="text" id="xodimPhone" placeholder="+998 (90) 123-45-67" maxlength="19">
        </div>
      </div>

      <div class="form-section-title">📝 Qo'shimcha</div>
      <div class="form-group">
        <label>Izoh</label>
        <textarea id="notes" rows="3" placeholder="Qo'shimcha ma'lumot (ixtiyoriy)"></textarea>
      </div>

      <div class="form-actions">
        <button class="btn-secondary" onclick="window.location.href='dashboard.html'">← Bekor qilish</button>
        <button class="btn-save" id="saveBtn">💾 Saqlash</button>
      </div>
    </div>
  </div>

  <script type="module" src="auth.js"></script>
  <script type="module" src="contract-form.js"></script>
</body>
</html>
